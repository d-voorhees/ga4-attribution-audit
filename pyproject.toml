[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ga4-attribution-audit"
version = "0.1.0"
description = "CLI toolkit for GA4 attribution audits against CallRail and Google Ads data"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Medium & Message" }]
keywords = ["ga4", "attribution", "marketing-analytics", "callrail", "google-ads"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business",
]
dependencies = [
    "click>=8.1",
    "google-analytics-data>=0.18",
    "google-ads>=24.0",
    "jinja2>=3.1",
    "pandas>=2.0",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "black>=24.0",
    "pytest>=8.0",
    "ruff>=0.4",
]

[project.scripts]
ga4-audit = "ga4_audit.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ga4_audit"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
